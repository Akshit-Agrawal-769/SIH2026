name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build C++ Visualizer
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential libnetcdf-dev libnetcdff-dev
          cd cpp_visualizer
          mkdir build && cd build
          cmake ..
          make

      - name: Install Python Dependencies and Run Tests
        run: |
          cd data-service
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest httpx netCDF4
          PYTHONPATH=. pytest tests/
        
      - name: Install Frontend Dependencies and Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Validate docker-compose.yml
        run: |
          docker-compose config
